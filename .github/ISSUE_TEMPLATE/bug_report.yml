name: Bug report
description: Tell us about a reproducible problem in RCRD.
title: "[Bug]: "
labels:
  - bug
  - user-feedback
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve RCRD. GitHub issues are public.

        Do not include `.env` or `.data` contents, credentials, tokens, session details, Spotify history exports, personal listening history, or other private information.
  - type: input
    id: version
    attributes:
      label: RCRD version
      description: Find this in Settings → About.
      placeholder: 1.3.38
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: Tell us what you saw and what you expected to see.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic or redacted examples only.
      placeholder: |
        1. Open …
        2. Select …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Listening and playback
        - Spotify saved music
        - Discogs collection or wantlist
        - Search and discovery
        - Settings, setup, or launch
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Share only non-sensitive details such as Windows and browser versions.
      placeholder: Windows 11, Chrome 142
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, tokens, session data, account identifiers, personal history, and other private information.
          required: true
